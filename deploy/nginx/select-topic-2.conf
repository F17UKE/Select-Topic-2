# Install in /etc/nginx/sites-available/select-topic-2, then symlink into sites-enabled.
# HTTP bootstrap only. Configure the real domain + HTTPS before LINE integration.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Add Strict-Transport-Security only in the approved HTTPS server block after
    # the certificate and redirect are active.
    # Backend accepts at most 10 MiB; allow multipart framing without weakening
    # the application's own byte limit.
    client_max_body_size 11m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /api { return 308 /api/; }
    location = /api/webhooks/line {
        proxy_pass http://10.0.7.6:3001;
        proxy_cache off;
    }
    location ^~ /api/ {
        # No trailing slash: preserve /api/health at the upstream.
        proxy_pass http://10.0.7.6:3001;
        proxy_cache off;
    }

    location = /webhooks/line {
        proxy_pass http://10.0.7.6:3001;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }
}
